<!DOCTYPE html>
<html lang="en">
<head>

<meta name="robots" content="noindex">

<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/kmd.css">
<style>
  .nf { text-align:center; padding:24px 0 8px; }

</head>
<body>
<div class="wrap">

  <div id="screen" class="nf">
    <picture><source srcset="/bluebird-dark.png" media="(prefers-color-scheme: dark)"><img src="/bluebird.png" alt="" width="256" height="221"></picture>
    <div class="code">404</div>
    <h1>Dead on arrival.</h1>
